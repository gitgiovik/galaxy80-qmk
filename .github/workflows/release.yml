name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Same build, size checks and emulator suite as every push.
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: galaxy80-firmware
          path: artifact

      - name: Assemble release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p release
          # Published: via, default, minimal. Never published: the debug image.
          for k in via default minimal; do
            cp "artifact/galaxy80_$k.bin" "release/galaxy80-$TAG-$k.bin"
          done
          cp keyboards/epomaker/galaxy80/via_json/galaxy80.json release/galaxy80.json
          cp artifact/BUILDINFO.txt release/BUILDINFO.txt
          (cd release && sha256sum galaxy80-*.bin galaxy80.json > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/galaxy80-*.bin
            release/galaxy80.json
            release/SHA256SUMS.txt
            release/BUILDINFO.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
